[project]
name = "insights"
version = "0.0.0"
description = "Customer Insights analytics service: metric calculations, snapshots and recommendations."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.10",
    "structlog>=25.4",
    "numpy>=2.3",
    "pandas>=2.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.17",
    "pandas-stubs>=2.3",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["insights"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["insights", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Starlette's TestClient deprecates httpx in favour of a successor package; revisit
    # once that package is vetted. Tests only, no runtime impact.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
